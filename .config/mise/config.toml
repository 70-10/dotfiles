[settings]
dotfiles.root = "~/dev/src/github.com/70-10/dotfiles"

[dotfiles]
"~/.editorconfig" = { mode = "symlink" }
"~/.gitattributes" = { mode = "symlink" }
"~/.gitconfig" = { mode = "symlink" }
"~/.vimrc" = { mode = "symlink" }
"~/.zlogin" = { mode = "symlink" }
"~/.zlogout" = { mode = "symlink" }
"~/.zprofile" = { mode = "symlink" }
"~/.zshenv" = { mode = "symlink" }
"~/.zshrc" = { mode = "symlink" }
"~/.config/ghostty" = { mode = "symlink" }
"~/.config/git" = { mode = "symlink" }
"~/.config/mise" = { mode = "symlink" }
"~/.config/nvim" = { mode = "symlink" }
"~/.config/sheldon" = { mode = "symlink" }
"~/.config/zsh" = { mode = "symlink" }
"~/.config/herdr/config.toml" = { mode = "symlink" }
"~/.config/npm/npmrc" = { mode = "symlink" }

[bootstrap.packages]
"brew:bat" = "latest"
"brew:cmake" = "latest"
"brew:colordiff" = "latest"
"brew:curl" = "latest"
"brew:eza" = "latest"
"brew:fd" = "latest"
"brew:gawk" = "latest"
"brew:gh" = "latest"
"brew:ghq" = "latest"
"brew:gibo" = "latest"
"brew:git" = "latest"
"brew:git-secrets" = "latest"
"brew:herdr" = "latest"
"brew:httpie" = "latest"
"brew:jo" = "latest"
"brew:jq" = "latest"
"brew:mas" = "latest"
"brew:neovim" = "latest"
"brew:nmap" = "latest"
"brew:peco" = "latest"
"brew:sheldon" = "latest"
"brew:the_silver_searcher" = "latest"
"brew:tig" = "latest"
"brew:tree" = "latest"
"brew:vim" = "latest"
"brew:wget" = "latest"

"brew-cask:1password" = "latest"
"brew-cask:caffeine" = "latest"
"brew-cask:ghostty" = "latest"
"brew-cask:google-chrome" = "latest"
"brew-cask:google-japanese-ime" = "latest"
"brew-cask:logi-options+" = "latest"
"brew-cask:obsidian" = "latest"
"brew-cask:qlmarkdown" = "latest"
"brew-cask:sequel-ace" = "latest"
"brew-cask:visual-studio-code" = "latest"
"brew-cask:font-camingocode" = "latest"
"brew-cask:font-hackgen" = "latest"
"brew-cask:font-jetbrains-mono" = "latest"

"mas:1024640650" = "latest" # CotEditor
"mas:441258766" = "latest"  # Magnet

[bootstrap.macos.keyboard]
initial_key_repeat = 15
key_repeat = 1
fn_state = true

[bootstrap.macos.defaults]
"com.apple.HIToolbox" = { AppleFnUsageType = 0 }

[[bootstrap.macos.defaults_entries]] # Move focus to next window
domain = "com.apple.symbolichotkeys"
key = "AppleSymbolicHotKeys"
path = ["27"]
value = { enabled = true, value = { type = "standard", parameters = [65535, 122, 9437184] } }

[[bootstrap.macos.defaults_entries]] # Mission Control
domain = "com.apple.symbolichotkeys"
key = "AppleSymbolicHotKeys"
path = ["32"]
value = { enabled = false, value = { type = "standard", parameters = [65535, 126, 10747904] } }

[[bootstrap.macos.defaults_entries]] # Application windows
domain = "com.apple.symbolichotkeys"
key = "AppleSymbolicHotKeys"
path = ["33"]
value = { enabled = false, value = { type = "standard", parameters = [65535, 125, 10747904] } }

[[bootstrap.macos.defaults_entries]] # Move focus to window drawer
domain = "com.apple.symbolichotkeys"
key = "AppleSymbolicHotKeys"
path = ["51"]
value = { enabled = true, value = { type = "standard", parameters = [65535, 122, 9961472] } }

[[bootstrap.macos.defaults_entries]] # Select the previous input source
domain = "com.apple.symbolichotkeys"
key = "AppleSymbolicHotKeys"
path = ["60"]
value = { enabled = true, value = { type = "standard", parameters = [32, 49, 1048576] } }

[[bootstrap.macos.defaults_entries]] # Select next source in Input menu
domain = "com.apple.symbolichotkeys"
key = "AppleSymbolicHotKeys"
path = ["61"]
value = { enabled = true, value = { type = "standard", parameters = [32, 49, 1572864] } }

[[bootstrap.macos.defaults_entries]] # Show Spotlight search
domain = "com.apple.symbolichotkeys"
key = "AppleSymbolicHotKeys"
path = ["64"]
value = { enabled = false, value = { type = "standard", parameters = [65535, 49, 1048576] } }

[[bootstrap.macos.defaults_entries]] # Show Finder search window
domain = "com.apple.symbolichotkeys"
key = "AppleSymbolicHotKeys"
path = ["65"]
value = { enabled = false, value = { type = "standard", parameters = [65535, 49, 1572864] } }

[[bootstrap.macos.defaults_entries]] # Move left a space
domain = "com.apple.symbolichotkeys"
key = "AppleSymbolicHotKeys"
path = ["79"]
value = { enabled = true, value = { type = "standard", parameters = [65535, 123, 11534336] } }

[[bootstrap.macos.defaults_entries]] # Move left a space (shift)
domain = "com.apple.symbolichotkeys"
key = "AppleSymbolicHotKeys"
path = ["80"]
value = { enabled = true, value = { type = "standard", parameters = [65535, 123, 11665408] } }

[[bootstrap.macos.defaults_entries]] # Move right a space
domain = "com.apple.symbolichotkeys"
key = "AppleSymbolicHotKeys"
path = ["81"]
value = { enabled = true, value = { type = "standard", parameters = [65535, 124, 11534336] } }

[[bootstrap.macos.defaults_entries]] # Move right a space (shift)
domain = "com.apple.symbolichotkeys"
key = "AppleSymbolicHotKeys"
path = ["82"]
value = { enabled = true, value = { type = "standard", parameters = [65535, 124, 11665408] } }

[tasks.bootstrap]
run = '''
test -f "$HOME/.local/share/nvim/site/autoload/plug.vim" ||
  curl -fLo "$HOME/.local/share/nvim/site/autoload/plug.vim" --create-dirs \
    https://raw.githubusercontent.com/junegunn/vim-plug/master/plug.vim
'''

[tools]
bun = "latest"
deno = "latest"
go = "latest"
node = "lts"
rust = "stable"
uv = "latest"
aws-cli = "latest"
ni = "latest"

"npm:@github/copilot" = "latest"
"npm:clipboard-cli" = "latest"
"npm:trash-cli" = "latest"
pnpm = "latest"

"npm:opencode-ai" = "latest"

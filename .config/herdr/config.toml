onboarding = false
[theme]
name = "nord"
auto_switch = false

[theme.custom]
subtext0 = "#abaca9"

[keys]
prefix = "ctrl+t"
split_vertical = "ctrl+alt+v"
split_horizontal = "ctrl+alt+h"

[experimental]
switch_ascii_input_source_in_prefix = true
pane_history = true

[ui]
agent_panel_sort = "priority"

show_agent_labels_on_pane_borders = true
[ui.sidebar.spaces]
rows = [["state_icon", { token = "workspace", fg = "#eff0eb" }], [{ token = "branch", fg = "#898a88" }, "git_status"]]

[ui.sidebar.agents]
rows = [
  ["state_icon", { token = "terminal_title_stripped", fg = "#eff0eb", bold = true, dim = false }],
  [{ token = "workspace", fg = "#abaca9", bold = false, dim = false }, { token = "tab", fg = "#898a88", bold = false }, { token = "agent", fg = "#898a88", bold = false }],
]

[ui.toast]
delivery = "system"
